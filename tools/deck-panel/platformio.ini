; The deck panel (#490, #615): an Elecrow CrowPanel Advance 7.0-HMI that shows DeckBridge's display feed.
;
; Portable code lives in lib/ and is tested on the Mac: pio test -e native
; The board layer lives in src/ and builds only for the panel.

[platformio]
default_envs = native

; Host tests for the portable code in lib/ (no Arduino, no board).
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -Werror

# LC6000 -> Syndicate OSC bridge mapping.
#
# Note and CC numbers come from Denon's "LC6000 PRIME MIDI Specification v1.0".
# Values marked PROVISIONAL could not be confirmed from the spec text and should
# be checked on the hardware with `lc6000-bridge monitor` / `led-sweep`.
# Copy this file, edit it, and pass it with `--config my_mapping.toml`.

[midi]
input = "LC6000"      # substring of the MIDI input port name
output = "LC6000"     # substring of the MIDI output port name (for LEDs)
channel = 1           # 1-16. The spec only documents channel 1. PROVISIONAL for deck layers.

[osc]
host = "127.0.0.1"    # Syndicate computer
port = 9090           # Settings -> OSC -> LISTEN PORT
root = "/Syndicate/"  # Settings -> Mapping -> OSC API -> ADDRESS ROOT
feedback_host = "0.0.0.0"
feedback_port = 9096  # Settings -> OSC FEEDBACK -> PORT

[deck]
number = 1            # Syndicate deck 1-4 this LC6000 controls

[jog]
# The spec lists the jog as a double-precision pair of relative CCs (55 upper, 54 lower).
# Community reports mention 55/54/31/17 for different jog modes. Every CC listed here is
# treated as relative ticks. PROVISIONAL: confirm with `monitor` and trim the list if a
# single turn shows up on several CCs (that would double the speed).
ccs = [55]
bend_release_ms = 80          # PhaseBend 0 is sent after the wheel stops this long
seek_seconds_per_tick = 0.02  # paused: how far one tick moves the playhead
seek_fallback_ticks_per_beat = 32  # paused, track length unknown: BeatSkip 1 per this many ticks
require_touch = false         # true = jog only acts while the platter is touched

[pitch]
msb_cc = 8
lsb_cc = 40
invert = false        # PROVISIONAL: flip if pushing the fader away from you slows down
dead_zone = 0.005     # snap to native tempo near the centre

[needle]
cc = 64               # Needle Drop strip, absolute 0-127 -> WaveformSeek
touch_note = 70
require_touch = true

[browse]
select_turn_cc = 6    # relative, browser up/down
auto_loop_size_cc = 3 # relative, halve/double the active loop

[notes]
play = 1
cue = 2
beat_jump_back = 3
beat_jump_forward = 4
track_prev = 5
track_next = 6
censor = 7
loop_in = 8
loop_out = 9
auto_loop = 10
back = 16
forward = 17
select_press = 18
vinyl = 19
sync = 20
master = 21
key_lock = 22
slip = 23
pitch_minus = 24
pitch_plus = 25
shift = 26
mode_hotcue = 27
mode_roll = 28
mode_slicer = 29
mode_loop = 30
pads = [32, 33, 34, 35, 36, 37, 38, 39]
platter_touch = 40
param_back = 68
param_forward = 69

[leds]
# PROVISIONAL: the spec's LED table lists the same note numbers as the buttons
# (plus 41-43 for the pitch arrows/centre), so each button's LED is assumed to be
# on its own note. Velocities: 0 off, 1 dim, 2-127 full.
pitch_center = 42
ring = 40             # platter LED ring, colour velocity
ring_color = [0, 128, 255]
roll_pad_color = [255, 140, 0]
loop_pad_color = [0, 255, 0]
dim_unlit_buttons = true

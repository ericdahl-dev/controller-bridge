[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lc6000-osc-bridge"
version = "0.1.0"
description = "Bridge a Denon LC6000 PRIME to Untitled Audio Syndicate over OSC, with LED feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mido>=1.3", "python-rtmidi>=1.5", "python-osc>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lc6000-bridge = "lc6000_bridge.cli:main"

[tool.setuptools]
packages = ["lc6000_bridge"]

[tool.setuptools.package-data]
lc6000_bridge = ["default_mapping.toml"]

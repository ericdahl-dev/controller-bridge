name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit:
    name: LC6000Kit tests
    # Standard GitHub-hosted runner: free for public repositories. Avoid -large/-xlarge (always billed).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package tests
        working-directory: Packages/LC6000Kit
        run: swift test

  app:
    name: App build (Release, ad-hoc)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      # Release: a Debug ad-hoc build drops the hardened runtime, so it wouldn't check what ships.
      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project LC6000Bridge.xcodeproj -scheme LC6000Bridge -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Check the signature
        run: |
          app=build/Build/Products/Release/LC6000Bridge.app
          info=$(codesign -dv "$app" 2>&1); echo "$info"
          [[ "$info" == *"flags="*"runtime"* ]] || { echo "hardened runtime missing"; exit 1; }
          ents=$(codesign -d --entitlements - --xml "$app" 2>/dev/null)
          for key in app-sandbox network.client network.server; do
            [[ "$ents" == *"com.apple.security.$key"* ]] || { echo "missing entitlement $key"; exit 1; }
          done
      # Best-effort on hosted runners: CoreMIDI or loopback UDP may not be usable there. Required locally.
      - name: Smoke (best-effort)
        continue-on-error: true
        run: SMOKE_LAUNCH_TIMEOUT=60 scripts/smoke.sh

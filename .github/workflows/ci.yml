name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a change needs (scripts/ci_changes.py): a change to only the website, its scripts or Markdown docs
  # skips the two Mac jobs. A skipped job counts as passed for the ruleset's required Kit tests check.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.diff.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # an unknown base (a new branch, a force push) lists nothing, and nothing runs everything
        run: '{ git diff --name-only "$BASE" HEAD || true; } | python3 -I scripts/ci_changes.py | tee -a "$GITHUB_OUTPUT"'

  site:
    name: Site check
    # The website (#169): plain files, so a cheap Linux runner. Not a required check yet.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Site check tests
        run: |
          python3 -I scripts/test_check_site.py
          python3 -I scripts/test_ci_changes.py
      - name: Site analytics tests
        run: node --test scripts/test_analytics.mjs scripts/test_capture.mjs
      - name: Site check
        run: python3 -I scripts/check_site.py website

  kit:
    name: Kit tests
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # Standard GitHub-hosted runner: free for public repositories. Avoid -large/-xlarge (always billed).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package tests
        working-directory: Packages/ControllerBridgeKit
        run: swift test
      # The release workflow (#28) only runs on tags, so its scripts are tested here on every pull request.
      - name: Release script tests
        run: |
          scripts/test-preflight.sh
          scripts/test-tag-external.sh
          python3 -I scripts/test_ci_profile.py
          python3 -I scripts/test_testflight_distribute.py
          python3 -I scripts/test_app_review.py

  app:
    name: App build (Release, ad-hoc)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      # Release: a Debug ad-hoc build drops the hardened runtime, so it wouldn't check what ships.
      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project ControllerBridge.xcodeproj -scheme ControllerBridge -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Check the signature
        run: |
          app=build/Build/Products/Release/ControllerBridge.app
          info=$(codesign -dv "$app" 2>&1); echo "$info"
          [[ "$info" == *"flags="*"runtime"* ]] || { echo "hardened runtime missing"; exit 1; }
          ents=$(codesign -d --entitlements - --xml "$app" 2>/dev/null)
          for key in app-sandbox network.client network.server; do
            [[ "$ents" == *"com.apple.security.$key"* ]] || { echo "missing entitlement $key"; exit 1; }
          done
      # A gate since #46: it passed on the 10 main runs from 99545f9 to 23a8788 (virtual MIDI and loopback UDP work on
      # hosted macos-26 runners). A failure fails this job, which is a required check.
      - name: Smoke
        run: SMOKE_LAUNCH_TIMEOUT=60 SMOKE_REQUIRE_AUTOMATIC=1 scripts/smoke.sh
